mode: prod
sensors:
  polling_frequency_hz: 50
  list:
    drum:
      gpio: 17
      type: impulse
      nominal_rpm: 800
      warn_low: 600
      warn_high: 1000
      error_threshold_low: 100
      error_duration_ms: 2000
      debounce_ms: 50
      description: Скорость вращения барабана
      units: об/мин
      enabled: true
      show_in_panel: true
    kolosa:
      gpio: 27
      type: impulse
      nominal_rpm: 400
      warn_low: 300
      warn_high: 500
      error_threshold_low: 50
      error_duration_ms: 2000
      debounce_ms: 50
      description: Скорость вращения колосового механизма
      units: об/мин
      enabled: true
      show_in_panel: true
    solomotryas:
      gpio: 24
      type: impulse
      nominal_rpm: 600
      warn_low: 450
      warn_high: 750
      error_threshold_low: 80
      error_duration_ms: 2000
      debounce_ms: 50
      description: Скорость вращения соломотряса
      units: об/мин
      enabled: true
      show_in_panel: false
    fan_speed:
      gpio: 23
      type: impulse
      nominal_rpm: 1200
      warn_low: 1000
      warn_high: 1400
      error_threshold_low: 200
      error_duration_ms: 2000
      debounce_ms: 50
      description: Скорость вращения вентилятора
      units: об/мин
      enabled: true
      show_in_panel: true
    bin_level:
      gpio: 22
      type: discrete
      description: Уровень заполнения бункера
      units: статус
      debounce_ms: 100
      enabled: true
      show_in_panel: false
    loss:
      enabled: true
    auger:
      enabled: true
stats:
  bin_volume_m3: 6.0
  session_timeout_min: 30
  heartbeat_interval_sec: 60
cultures:
  Пшеница:
    density: 0.77
  Ячмень:
    density: 0.63
  Рапс:
    density: 0.65
  Подсолнечник:
    density: 0.42
  Кукуруза:
    density: 0.73
  Горох:
    density: 0.78
  Гречиха:
    density: 0.63
  Овёс:
    density: 0.52
  Фацелия:
    density: 0.55
  Эспарцет:
    density: 0.6
unload_logic:
  bin_full_sensor: 22
  min_full_duration_ms: 1000
  min_empty_duration_ms: 500
  debounce_ms: 100
  description: Логика определения событий разгрузки
error_history:
  max_entries: 20
logging:
  data_dir: data
  date_format: '%Y-%m-%d'
  csv_log_enabled: true
  description: Логирование событий в CSV
ui:
  resolution:
    width: 1024
    height: 600
  orientation: horizontal
  fonts:
    scale: 1.0
  theme: light
  window_mode: fullscreen
  transparent: false
  colors_light:
    background: '#eef1f5'
    surface: '#ffffff'
    text_primary: '#192230'
    text_secondary: '#5d6b7e'
    primary: '#1f6feb'
    on_primary: '#ffffff'
    error_critical: '#d92d20'
    error_warning: '#e8830c'
    border: '#e1e6ee'
    menu_background: '#ffffff'
  colors_dark:
    background: '#1b2634'
    surface: '#27323f'
    text_primary: '#f1f5fa'
    text_secondary: '#a4b2c4'
    primary: '#5b9bff'
    on_primary: '#0a1018'
    error_critical: '#ff6157'
    error_warning: '#ffb13b'
    border: '#3a4655'
    menu_background: '#202b3a'
interface:
  display_sensors:
  - drum
  - kolosa
  - solomotryas
  - fan_speed
  main_sensor: drum
  ui_update_frequency_hz: 10
  show_time: true
  time_format: '%H:%M:%S'
  show_error_icons: true
  max_error_icons_per_row: 5
  cultures:
  - Пшеница
  - Ячмень
  - Рапс
  - Подсолнечник
  - Кукуруза
  - Горох
  - Гречиха
  - Овёс
  - Фацелия
  - Эспарцет
  dialogs:
    show_shutdown_confirmation: true
project_info:
  name: Бортовой компьютер Дон 1500б
  version: 1.0.0
  description: Система мониторинга датчиков комбайна на основе Raspberry Pi 5
  hardware:
  - Raspberry Pi 5
  - Дисплей 1200×600 (7 дюймов, сенсорный)
  - Модуль оптической изоляции (8-канальный, 24V to 5V)
  - Датчики (импульсные, дискретные, аналоговые)
  os: Ubuntu 24.04 LTS
  python_version: 3.11+
  last_updated: '2024-05-20'
